# Runs on every push and pull request: the browser tests against the source (file://) and against
# the built site (http, CSP, service worker), then a check that the committed CSS defines the same classes as a fresh build.
# A separate job scans the whole git history for passwords, API keys and tokens (D036).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Uses the committed css/tailwind.css. The structure suite fails if any class on screen has no CSS.
      - name: Test the source
        run: npm test

      # Rebuilds css/tailwind.css, builds dist/ and tests it over http (CSP and service worker on)
      - name: Test the built site
        run: npm run test:dist

      # test:dist rebuilt css/tailwind.css; the committed one must define the same classes
      - name: Check the committed Tailwind CSS is up to date
        run: |
          npm run build:legacy-css
          node scripts/check-css.mjs

      - name: Keep screenshots if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: tests/output/
          if-no-files-found: ignore

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Pinned version, checked against its published checksum.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan the history for secrets
        run: ./gitleaks git --redact --no-banner -v
