# Runs on every push and pull request: the browser tests against the source (file://) and against
# the built site (http, CSP, service worker), then a check that the committed CSS is current.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Uses the committed css/tailwind.css. The structure suite fails if any class on screen has no CSS.
      - name: Test the source
        run: npm test

      # Rebuilds css/tailwind.css, builds dist/ and tests it over http (CSP and service worker on)
      - name: Test the built site
        run: npm run test:dist

      - name: Warn if the committed Tailwind CSS differs from a fresh build
        run: |
          npm run build:legacy-css
          git diff --quiet -- css/tailwind.css legacy/prototype-v1/css/tailwind.css \
            || echo "::warning::css/tailwind.css differs from a fresh build. Run 'npm run build:css' (and 'npm run build:legacy-css') and commit the result."

      - name: Keep screenshots if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: tests/output/
          if-no-files-found: ignore
