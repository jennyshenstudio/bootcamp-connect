# Publishes dist/ to GitHub Pages after CI passes on main (D028).
#
# Off until the owner turns it on, because Pages makes the app public (D004):
#   1. Settings > Pages > Build and deployment > Source: GitHub Actions
#   2. Settings > Secrets and variables > Actions > Variables: DEPLOY_PAGES = true
# It can also be run by hand from the Actions tab ("Run workflow").
name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.DEPLOY_PAGES == 'true' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Compiles css/tailwind.css, then assembles dist/
      - name: Build dist/
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
